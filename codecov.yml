# Codecov behaviour for this repo. Coverage is informational only: the
# `validate` job stays the sole required status, and a Codecov outage or a
# coverage dip must never block a release on its own.

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, files"
  require_changes: false
